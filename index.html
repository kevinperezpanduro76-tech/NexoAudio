<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NexoAudio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #3b82f6;
      --active: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px;
    }
    header { text-align: center; width: 100%; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    #statusText { margin-top: 6px; font-size: 0.92rem; color: var(--muted); }
    .main-btn-wrapper { display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; }
    #connectBtn {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #60a5fa, var(--primary));
      color: white;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.45);
      transition: transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #connectBtn:active { transform: scale(0.95); }
    #connectBtn:disabled { opacity: 0.6; cursor: default; transform: none; }
    #connectBtn.connected {
      background: radial-gradient(circle at 30% 30%, #34d399, var(--active));
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.5);
    }
    #connectBtn span.sub { font-size: 0.8rem; font-weight: 500; opacity: 0.9; letter-spacing: 0; }
    .controls { width: 100%; max-width: 380px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .toggle-btn {
      background: var(--card);
      border: 1px solid #334155;
      color: var(--text);
      padding: 14px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.off { opacity: 0.5; border-color: var(--danger); color: #fca5a5; }
    .toggle-btn.on { border-color: var(--active); color: #6ee7b7; }
    .toggle-btn:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }
    input { user-select: text; -webkit-user-select: text; }
    .ip-field { width: 100%; max-width: 380px; margin: 14px auto 0; }
    .ip-row { display: flex; gap: 8px; }
    .ip-field input {
      flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid #334155;
      background: var(--card); color: var(--text); font-size: 1rem; text-align: center; outline: none;
    }
    .ip-field input:focus { border-color: var(--primary); }
    .ip-field input:disabled { opacity: 0.5; }
    #scanBtn {
      padding: 0 16px; border-radius: 14px; border: 1px solid #334155;
      background: var(--card); color: var(--text); font-size: 1.1rem; cursor: pointer;
    }
    #scanBtn:disabled { opacity: 0.5; cursor: default; }
    .ip-field small { display: block; margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
    .support { width: 100%; max-width: 380px; margin-top: 16px; text-align: center; }
    #supportBtn {
      width: 100%; padding: 13px 12px; border-radius: 14px; border: 1px solid rgba(244, 114, 182, 0.45);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.16), rgba(139, 92, 246, 0.16));
      color: #fbcfe8; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .support-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .support-links a { padding: 12px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: 700; font-size: 0.9rem; }
    #kofiLink { background: #29abe0; }
    #patreonLink { background: #f96854; }
    #patreonLink.full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <h1>NexoAudio Local</h1>
    <p id="statusText">Listo para conectar a tu Laptop</p>
    <div class="ip-field" id="ipField" hidden>
      <div class="ip-row">
        <input id="serverIp" type="text" inputmode="decimal" placeholder="IP de tu laptop (ej. 192.168.1.20)" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="scanBtn" type="button" title="Buscar laptop en la red">🔍</button>
      </div>
      <small>Se busca automáticamente o escríbela según la consola de tu PC</small>
    </div>
  </header>

  <div class="main-btn-wrapper">
    <button id="connectBtn">
      <span id="btnLabel">CONECTAR</span>
      <span class="sub" id="btnSub">Toca para iniciar</span>
    </button>
  </div>

  <div class="controls">
    <button id="toggleSpeaker" class="toggle-btn">🔊 Altavoz: ON</button>
    <button id="toggleMic" class="toggle-btn">🎙️ Micrófono: ON</button>
    <button id="toggleEcho" class="toggle-btn">🎧 Anti-eco: OFF</button>
    <button id="toggleStable" class="toggle-btn">📶 Buffer: Auto</button>
  </div>

  <div class="support">
    <button id="supportBtn">💜 Apoyar proyecto (Patreon)</button>
    <div class="support-links" id="supportLinks" hidden>
      <a id="kofiLink" target="_blank" rel="noopener">Ko-fi</a>
      <a id="patreonLink" target="_blank" rel="noopener">Patreon</a>
    </div>
  </div>

  <!-- AudioWorklet con jitter buffer adaptativo anti-cortes -->
  <script type="text/js-worklet" id="relay-worklet">
    const CAP = 1 << 17, MASK = CAP - 1;   // ring buffer: 131072 frames por canal (~2.7 s a 48 kHz)
    const MIC_CHUNK = 960;                 // ~20 ms por paquete de micrófono (mitad de sobrecarga Wi-Fi/IPC)

    class RelayProcessor extends AudioWorkletProcessor {
      constructor() {
        super();
        this.L = new Float32Array(CAP);
        this.R = new Float32Array(CAP);
        this.ch = 2;
        this.inRate = 48000;
        this.ratio = 1;
        this.baseMs = 90;
        this.maxMs = 260;
        this.curMs = 90;
        this.target = 4320;
        this.micOn = true;
        this.pcm = new Int16Array(MIC_CHUNK);
        this.ci = 0;
        this.stableSamples = 0;
        this.reportCounter = 0;
        this.underruns = 0;
        this.reset();
        this.port.onmessage = (e) => {
          const m = e.data;
          if (m.type === "cfg") {
            this.ch = Math.max(1, m.channels | 0);
            this.inRate = m.rate || 48000;
            this.ratio = this.inRate / sampleRate;
            this.baseMs = m.targetMs || 90;
            this.maxMs = m.maxMs || 260;
            this.curMs = this.baseMs;
            this.updateTarget();
            this.reset();
          } else if (m.type === "buffer_mode") {
            this.baseMs = m.targetMs || 90;
            this.maxMs = m.maxMs || 260;
            if (this.curMs < this.baseMs) this.curMs = this.baseMs;
            if (this.curMs > this.maxMs) this.curMs = this.maxMs;
            this.updateTarget();
          } else if (m.type === "mic") {
            this.micOn = Boolean(m.enabled);
            this.ci = 0;
          } else if (m.type === "flush") {
            this.reset();
          } else if (m.type === "pcm") {
            this.write(new Int16Array(m.buf));
          }
        };
      }

      updateTarget() {
        this.target = Math.max(512, Math.round(this.inRate * this.curMs / 1000));
      }

      reset() {
        this.w = 0;
        this.rp = 0;
        this.fs = this.target;
        this.g = 0;
        this.dk = 0;
        this.lastL = 0;
        this.lastR = 0;
        this.fadeL = 0;
        this.fadeR = 0;
        this.playing = false;
        this.stableSamples = 0;
      }

      write(s) {
        const ch = this.ch, n = (s.length / ch) | 0;
        if (n <= 0) return;
        for (let i = 0; i < n; i++) {
          const o = i * ch, j = (this.w + i) & MASK;
          let l = s[o], r = ch > 1 ? s[o + 1] : l;
          if (ch >= 6) {
            const c = s[o + 2] * 0.7071;
            l = (l + c + s[o + 4] * 0.7071) * 0.58;
            r = (r + c + s[o + 5] * 0.7071) * 0.58;
          }
          this.L[j] = l / 32768;
          this.R[j] = r / 32768;
        }
        this.w += n;

        // Si el retraso acumulado excede el límite seguro, salta al colchón con crossfade suave
        const maxLag = Math.min(CAP - 4096, Math.max(this.target * 3, Math.round(this.inRate * 0.45)));
        if (this.w - this.rp > maxLag) {
          this.fadeL = this.lastL;
          this.fadeR = this.lastR;
          this.rp = this.w - this.target;
          this.fs = this.target;
          this.g = 0;
        }
      }

      process(inputs, outputs) {
        // --- Captura del micrófono solo cuando está habilitado ---
        const inp = this.micOn && inputs[0] && inputs[0][0];
        if (inp) {
          for (let i = 0; i < inp.length; i++) {
            const s = Math.max(-1, Math.min(1, inp[i]));
            this.pcm[this.ci++] = s < 0 ? s * 32768 : s * 32767;
            if (this.ci === MIC_CHUNK) {
              this.port.postMessage({ type: "mic", buf: this.pcm.buffer }, [this.pcm.buffer]);
              this.pcm = new Int16Array(MIC_CHUNK);
              this.ci = 0;
            }
          }
        }

        // --- Reproducción con jitter buffer adaptativo y crossfade anti-pop ---
        const out = outputs[0], oL = out[0], oR = out[1] || out[0];
        const fill = this.w - this.rp;

        if (!this.playing && fill >= this.target) {
          this.playing = true;
          this.fadeL = this.lastL;
          this.fadeR = this.lastR;
          this.g = 0;
          this.fs = fill;
        }

        if (this.playing) {
          this.fs += (fill - this.fs) * 0.0025;
          this.stableSamples += oL.length;
          // Tras 12 segundos sin cortes, reduce gradualmente el colchón hacia baseMs
          if (this.stableSamples >= sampleRate * 12) {
            this.stableSamples = 0;
            if (this.curMs > this.baseMs) {
              this.curMs = Math.max(this.baseMs, this.curMs - 10);
              this.updateTarget();
            }
          }
        }

        const diff = this.fs - this.target;
        const adj = Math.abs(diff) < this.target * 0.25
          ? 0
          : Math.max(-0.005, Math.min(0.005, diff / (this.target * 65)));
        const step = this.ratio * (1 + adj);

        for (let i = 0; i < oL.length; i++) {
          let l, r;
          if (this.playing && this.w - this.rp > 2) {
            const k = Math.floor(this.rp), f = this.rp - k;
            const a = k & MASK, b = (k + 1) & MASK;
            l = this.L[a] + f * (this.L[b] - this.L[a]);
            r = this.R[a] + f * (this.R[b] - this.R[a]);

            if (this.g < 1) {
              this.g = Math.min(1, this.g + 0.004);
              l = this.fadeL + (l - this.fadeL) * this.g;
              r = this.fadeR + (r - this.fadeR) * this.g;
            }
            this.rp += step;
            this.lastL = l;
            this.lastR = r;
            this.dk = 1;
          } else {
            if (this.playing) {
              // Ocurrió un corte por jitter de red: amplía automáticamente el buffer para estabilizar este celular
              this.playing = false;
              this.underruns++;
              this.stableSamples = 0;
              if (this.curMs < this.maxMs) {
                this.curMs = Math.min(this.maxMs, this.curMs + 30);
                this.updateTarget();
              }
            }
            l = this.lastL * this.dk;
            r = this.lastR * this.dk;
            this.lastL = l;
            this.lastR = r;
            this.dk *= 0.985;
          }
          oL[i] = l;
          oR[i] = r;
        }

        if (this.rp >= CAP) {
          this.rp -= CAP;
          this.w -= CAP;
        }

        this.reportCounter += oL.length;
        if (this.reportCounter >= sampleRate * 2) {
          this.reportCounter = 0;
          this.port.postMessage({ type: "stats", curMs: this.curMs, underruns: this.underruns });
        }
        return true;
      }
    }
    registerProcessor("relay", RelayProcessor);
  </script>

  <script>
    const AUTO_BASE_MS = 90;        // inicio bajo, sube automáticamente hasta 260 ms si hay jitter Wi-Fi
    const AUTO_MAX_MS = 260;
    const STABLE_BASE_MS = 160;     // modo estable para celulares con Wi-Fi irregular
    const STABLE_MAX_MS = 320;
    const CONNECT_TIMEOUT_MS = 8000;
    const AUTO_RETRY_MS = 3500;
    const KOFI_URL = "";
    const PATREON_URL = "https://patreon.com/Kaell456?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink";
    const APP_PORT = 8080;
    const IN_APP = Boolean(
      window.Capacitor ||
      window.NexoNative ||
      location.protocol === "file:" ||
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1"
    );

    let ws = null, audioCtx = null, micStream = null, micSource = null, node = null, wakeLock = null;
    let state = "idle";
    let speakerEnabled = true;
    let micEnabled = true;
    let echoCancel = false;
    let stableMode = false;
    let switchingMic = false;
    let scanning = false;
    let manualDisconnect = false;
    let lastPcRate = 48000;
    let currentBufferMs = AUTO_BASE_MS;
    let serverInfo = { vbcable_active: true, loopback_active: true, loopback_is_vbcable: false };
    let micIssue = "";

    const connectBtn = document.getElementById("connectBtn");
    const btnLabel = document.getElementById("btnLabel");
    const btnSub = document.getElementById("btnSub");
    const statusText = document.getElementById("statusText");
    const toggleSpeakerBtn = document.getElementById("toggleSpeaker");
    const toggleMicBtn = document.getElementById("toggleMic");
    const toggleEchoBtn = document.getElementById("toggleEcho");
    const toggleStableBtn = document.getElementById("toggleStable");
    const ipField = document.getElementById("ipField");
    const ipInput = document.getElementById("serverIp");
    const scanBtn = document.getElementById("scanBtn");
    const supportBtn = document.getElementById("supportBtn");
    const kofiLink = document.getElementById("kofiLink");
    const patreonLink = document.getElementById("patreonLink");

    ipField.hidden = !IN_APP;
    try {
      ipInput.value = localStorage.getItem("serverIp") || "";
      stableMode = localStorage.getItem("stableMode") === "1";
    } catch (e) {}

    patreonLink.href = PATREON_URL;
    if (KOFI_URL && !KOFI_URL.includes("TU_USUARIO")) {
      kofiLink.href = KOFI_URL;
      supportBtn.textContent = "💜 Apoyar proyecto (Patreon / Ko-fi)";
    } else {
      kofiLink.hidden = true;
      patreonLink.classList.add("full");
      supportBtn.textContent = "💜 Apoyar proyecto en Patreon";
    }
    supportBtn.addEventListener("click", () => {
      const links = document.getElementById("supportLinks");
      links.hidden = !links.hidden;
    });

    function bufferParams() {
      return stableMode
        ? { targetMs: STABLE_BASE_MS, maxMs: STABLE_MAX_MS }
        : { targetMs: AUTO_BASE_MS, maxMs: AUTO_MAX_MS };
    }

    function renderStableBtn() {
      toggleStableBtn.textContent = stableMode ? "🛡️ Buffer: Estable" : "📶 Buffer: Auto";
      toggleStableBtn.classList.toggle("on", stableMode);
    }
    renderStableBtn();

    toggleStableBtn.addEventListener("click", () => {
      stableMode = !stableMode;
      try { localStorage.setItem("stableMode", stableMode ? "1" : "0"); } catch (e) {}
      renderStableBtn();
      const bp = bufferParams();
      currentBufferMs = bp.targetMs;
      if (node) node.port.postMessage({ type: "buffer_mode", ...bp });
      if (state === "connected") statusText.textContent = connectedText();
    });

    const unlockAudioOnTouch = () => {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (state === "connected" && micEnabled && !micStream && !micIssue) {
        attachMicrophone();
      }
    };
    window.addEventListener("pointerdown", unlockAudioOnTouch, { passive: true });
    window.addEventListener("touchstart", unlockAudioOnTouch, { passive: true });

    const LABELS = {
      idle: ["CONECTAR", "Toca para iniciar"],
      connecting: ["CONECTANDO…", "Espera un momento"],
      connected: ["CONECTADO", "Toca para desconectar"]
    };

    function setUI(s, text) {
      connectBtn.disabled = s === "connecting";
      toggleEchoBtn.disabled = s === "connecting";
      ipInput.disabled = s !== "idle";
      scanBtn.disabled = s !== "idle" || scanning;
      connectBtn.classList.toggle("connected", s === "connected");
      btnLabel.textContent = LABELS[s][0];
      btnSub.textContent = LABELS[s][1];
      if (text) statusText.textContent = text;
    }

    async function checkServerIp(ip, timeoutMs = 750) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const r = await fetch(`http://${ip}:${APP_PORT}/ping`, {
          signal: ctrl.signal,
          cache: "no-store",
          mode: "cors"
        });
        const data = await r.json();
        if (data && data.app === "nexoaudio") return ip;
      } catch (e) {} finally {
        clearTimeout(t);
      }
      throw new Error("no_match");
    }

    async function getPhoneSubnetPrefixes() {
      const prefixes = new Set();
      if (window.NexoNative && typeof window.NexoNative.getLocalSubnets === "function") {
        try {
          const arr = JSON.parse(window.NexoNative.getLocalSubnets() || "[]");
          if (Array.isArray(arr)) arr.forEach((p) => { if (p) prefixes.add(p); });
        } catch (e) {}
      }
      if (window.RTCPeerConnection) {
        await new Promise((resolve) => {
          let done = false;
          const finish = () => { if (!done) { done = true; resolve(); } };
          setTimeout(finish, 500);
          try {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel("");
            pc.onicecandidate = (e) => {
              if (!e || !e.candidate || !e.candidate.candidate) return;
              const m = e.candidate.candidate.match(/\b((?:192\.168|10\.\d+|172\.(?:1[6-9]|2\d|3[01]))\.\d+)\.\d+\b/);
              if (m) {
                prefixes.add(m[1]);
                try { pc.close(); } catch (err) {}
                finish();
              }
            };
            pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(finish);
          } catch (e) {
            finish();
          }
        });
      }
      return [...prefixes];
    }

    async function scanIpList(ips, concurrency = 16, timeoutMs = 700) {
      if (!ips.length) return null;
      return new Promise((resolve) => {
        let idx = 0, active = 0, found = null;
        function next() {
          if (found || state !== "idle") {
            if (active === 0) resolve(found);
            return;
          }
          while (active < concurrency && idx < ips.length && !found && state === "idle") {
            const ip = ips[idx++];
            active++;
            checkServerIp(ip, timeoutMs)
              .then((res) => {
                if (!found) {
                  found = res;
                  resolve(res);
                }
              })
              .catch(() => {})
              .finally(() => {
                active--;
                if (!found && idx >= ips.length && active === 0) resolve(null);
                else if (!found) next();
              });
          }
        }
        next();
      });
    }

    async function autoDiscoverServer(autoConnect = true) {
      if (!IN_APP || scanning || state !== "idle") return;
      scanning = true;
      scanBtn.disabled = true;
      let discoveredIp = null;

      try {
        const saved = ipInput.value.trim().replace(/^[a-z]+:\/\//i, "").replace(/[:/].*$/, "");

        if (window.NexoNative && typeof window.NexoNative.discoverServer === "function") {
          try {
            const udpIp = (window.NexoNative.discoverServer(APP_PORT, 420) || "").trim();
            if (/^\d+\.\d+\.\d+\.\d+$/.test(udpIp)) discoveredIp = udpIp;
          } catch (e) {}
        }

        if (!discoveredIp && state === "idle") {
          const quickCandidates = [...new Set([
            /^\d+\.\d+\.\d+\.\d+$/.test(saved) ? saved : null,
            "192.168.137.1",
            "192.168.43.1"
          ].filter(Boolean))];
          const quickHit = await scanIpList(quickCandidates, 4, 650);
          if (quickHit) discoveredIp = quickHit;
        }

        if (!discoveredIp && state === "idle") {
          const phonePrefixes = await getPhoneSubnetPrefixes();
          const savedPrefix = saved.match(/^(\d+\.\d+\.\d+)\./)?.[1];
          const prefixes = [...new Set([
            ...phonePrefixes,
            savedPrefix,
            "192.168.1",
            "192.168.0",
            "192.168.18",
            "192.168.100",
            "192.168.137",
            "192.168.43",
            "192.168.31",
            "192.168.68",
            "10.0.0"
          ].filter(Boolean))];

          for (const prefix of prefixes) {
            if (state !== "idle" || discoveredIp) break;
            statusText.textContent = `Buscando laptop en ${prefix}.x...`;
            const ips = [];
            for (let i = 1; i < 255; i++) ips.push(`${prefix}.${i}`);
            const found = await scanIpList(ips, 16, 650);
            if (found) {
              discoveredIp = found;
              break;
            }
          }
        }

        if (discoveredIp) {
          ipInput.value = discoveredIp;
          try { localStorage.setItem("serverIp", discoveredIp); } catch (e) {}
          statusText.textContent = `Laptop detectada en ${discoveredIp}. Conectando...`;
        } else if (state === "idle") {
          statusText.textContent = "Esperando a tu laptop en la red (o escribe la IP)...";
        }
      } finally {
        scanning = false;
        scanBtn.disabled = state !== "idle";
      }

      if (discoveredIp && autoConnect && state === "idle") {
        startConnection();
      }
    }

    scanBtn.addEventListener("click", () => {
      manualDisconnect = false;
      autoDiscoverServer(true);
    });

    toggleSpeakerBtn.addEventListener("click", () => {
      speakerEnabled = !speakerEnabled;
      toggleSpeakerBtn.textContent = speakerEnabled ? "🔊 Altavoz: ON" : "🔇 Altavoz: OFF";
      toggleSpeakerBtn.classList.toggle("off", !speakerEnabled);
      if (node) node.port.postMessage({ type: "flush" });
    });

    toggleMicBtn.addEventListener("click", () => {
      micEnabled = !micEnabled;
      toggleMicBtn.textContent = micEnabled ? "🎙️ Micrófono: ON" : "🚫 Micrófono: OFF";
      toggleMicBtn.classList.toggle("off", !micEnabled);
      if (node) node.port.postMessage({ type: "mic", enabled: micEnabled });
      if (micEnabled && state === "connected" && !micStream) {
        micIssue = "";
        attachMicrophone();
      }
      if (state === "connected") statusText.textContent = connectedText();
    });

    const micConstraints = () => ({
      echoCancellation: echoCancel,
      noiseSuppression: echoCancel,
      autoGainControl: true,
      channelCount: { ideal: 1 }
    });

    const connectedText = () => {
      if (!serverInfo.loopback_active) {
        return "⚠️ PC sin salida de audio activa (revisa altavoces en Windows)";
      }
      if (serverInfo.loopback_is_vbcable) {
        return "⚠️ En Windows cambia el altavoz predeterminado fuera de VB-Cable";
      }
      if (!serverInfo.vbcable_active) {
        return `Altavoz activo (${currentBufferMs} ms) | VB-Cable no detectado en PC`;
      }
      if (micEnabled && micIssue) {
        return `Altavoz activo (${currentBufferMs} ms) | ${micIssue}`;
      }
      const phoneHz = audioCtx ? audioCtx.sampleRate : 48000;
      const hzInfo = lastPcRate && lastPcRate !== phoneHz ? `${lastPcRate}→${phoneHz} Hz` : `${phoneHz} Hz`;
      return `Activo (${hzInfo} · buffer ${currentBufferMs} ms)`;
    };

    function renderEcho() {
      toggleEchoBtn.textContent = echoCancel ? "🎧 Anti-eco: ON" : "🎧 Anti-eco: OFF";
      toggleEchoBtn.classList.toggle("on", echoCancel);
    }

    async function requestMicStream() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
      } catch (err) {
        // Respaldo si el dispositivo rechaza alguna constraint (ej. channelCount o autoGainControl)
        if (err && (err.name === "OverconstrainedError" || err.name === "TypeError")) {
          return await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        throw err;
      }
    }

    async function attachMicrophone() {
      if (!micEnabled || !audioCtx || !node || micStream) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micIssue = "Micrófono bloqueado (usa la APK o abre por HTTPS)";
        if (state === "connected") statusText.textContent = connectedText();
        return;
      }
      try {
        const stream = await requestMicStream();
        if (state === "idle" || !audioCtx || !node) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        micIssue = "";
        micStream = stream;
        micSource = audioCtx.createMediaStreamSource(micStream);
        micSource.connect(node);
        node.port.postMessage({ type: "mic", enabled: micEnabled });
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        if (state === "connected") statusText.textContent = connectedText();
      } catch (err) {
        console.warn("Error accediendo al micrófono:", err);
        micIssue = err && err.name === "NotAllowedError"
          ? "Sin permiso de micrófono"
          : "No se pudo abrir el micrófono";
        if (state === "connected") statusText.textContent = connectedText();
      }
    }

    toggleEchoBtn.addEventListener("click", async () => {
      if (switchingMic) return;
      echoCancel = !echoCancel;
      renderEcho();
      if (state !== "connected" || !micStream) return;

      switchingMic = true;
      try {
        const next = await requestMicStream();
        if (state !== "connected") { next.getTracks().forEach((t) => t.stop()); return; }
        if (micSource) micSource.disconnect();
        micStream.getTracks().forEach((t) => t.stop());
        micStream = next;
        micSource = audioCtx.createMediaStreamSource(micStream);
        micSource.connect(node);
        statusText.textContent = connectedText();
      } catch (err) {
        echoCancel = !echoCancel;
        renderEcho();
        statusText.textContent = "No se pudo cambiar el anti-eco";
      } finally {
        switchingMic = false;
      }
    });

    connectBtn.addEventListener("click", () => {
      if (state === "idle") {
        manualDisconnect = false;
        startConnection();
      } else if (state === "connected") {
        manualDisconnect = true;
        stopConnection("Desconectado. Toca CONECTAR para volver a iniciar");
      }
    });

    async function acquireWakeLock() {
      if (!("wakeLock" in navigator) || wakeLock) return;
      try {
        const lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
        wakeLock = lock;
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (state === "connected") {
        acquireWakeLock();
        if (audioCtx && audioCtx.state !== "running") audioCtx.resume().catch(() => {});
      } else if (IN_APP && state === "idle" && !manualDisconnect) {
        autoDiscoverServer(true);
      }
    });

    function stopConnection(msg) {
      state = "idle";
      micIssue = "";
      if (ws) {
        const s = ws;
        ws = null;
        s.onopen = s.onmessage = s.onclose = s.onerror = null;
        try { s.close(1000); } catch (e) {}
      }
      if (node) {
        node.port.onmessage = null;
        try { node.disconnect(); } catch (e) {}
        node = null;
      }
      if (micSource) {
        try { micSource.disconnect(); } catch (e) {}
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((t) => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      setUI("idle", msg || "Listo para conectar a tu Laptop");
    }

    function serverHost() {
      const v = ipInput.value.trim().replace(/^[a-z]+:\/\//i, "").replace(/[:/].*$/, "");
      if (!/^[\w.-]+$/.test(v)) return "";
      try { localStorage.setItem("serverIp", v); } catch (e) {}
      return `${v}:${APP_PORT}`;
    }

    async function startConnection() {
      if (state !== "idle") return;
      if (IN_APP && !serverHost()) {
        statusText.textContent = "Buscando IP de tu laptop automáticamente...";
        await autoDiscoverServer(true);
        return;
      }
      state = "connecting";
      micIssue = "";
      setUI("connecting", "Conectando con la laptop...");

      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        // "balanced" evita cortes de hardware en celulares Android con buffers muy ajustados
        audioCtx = new Ctx({ latencyHint: "balanced" });
        audioCtx.resume().catch(() => {});

        const blobUrl = URL.createObjectURL(
          new Blob([document.getElementById("relay-worklet").textContent], { type: "application/javascript" })
        );
        try { await audioCtx.audioWorklet.addModule(blobUrl); } finally { URL.revokeObjectURL(blobUrl); }

        node = new AudioWorkletNode(audioCtx, "relay", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
          channelCount: 1,
          channelCountMode: "explicit"
        });
        node.port.onmessage = onWorkletMessage;
        node.port.postMessage({ type: "mic", enabled: micEnabled });
        node.connect(audioCtx.destination);

        acquireWakeLock();
        openSocket();
        if (micEnabled) attachMicrophone();
      } catch (err) {
        stopConnection("Error: " + (err.message || "No se pudo iniciar el motor de audio"));
      }
    }

    function openSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url = IN_APP ? `ws://${serverHost()}/ws` : `${proto}//${location.host}/ws`;
      const sock = new WebSocket(url);
      sock.binaryType = "arraybuffer";
      ws = sock;

      sock.onopen = () => {
        state = "connected";
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        setUI("connected", connectedText());
        sock.send(JSON.stringify({ type: "client_config", mic_rate: audioCtx ? audioCtx.sampleRate : 48000 }));
      };
      sock.onmessage = onSocketMessage;

      const dropped = (e) => {
        const wasConnected = state === "connected";
        if (e && e.reason === "replaced") manualDisconnect = true;
        stopConnection(
          e && e.reason === "replaced" ? "Otro dispositivo tomó la sesión"
            : wasConnected ? "Conexión perdida. Reintentando..."
            : "No se pudo conectar: buscando laptop en la red..."
        );
      };
      sock.onclose = dropped;
      sock.onerror = dropped;

      setTimeout(() => {
        if (ws === sock && state === "connecting") stopConnection("Tiempo de espera agotado. Reintentando...");
      }, CONNECT_TIMEOUT_MS);
    }

    function onSocketMessage(event) {
      if (typeof event.data === "string") {
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === "config" && node) {
          lastPcRate = msg.pc_rate || 48000;
          serverInfo = {
            vbcable_active: Boolean(msg.vbcable_active),
            loopback_active: msg.loopback_active !== false,
            loopback_is_vbcable: Boolean(msg.loopback_is_vbcable)
          };
          const bp = bufferParams();
          currentBufferMs = bp.targetMs;
          node.port.postMessage({ type: "cfg", rate: msg.pc_rate, channels: msg.pc_channels, ...bp });
          statusText.textContent = connectedText();
        }
        return;
      }
      if (!speakerEnabled || !node) return;
      node.port.postMessage({ type: "pcm", buf: event.data }, [event.data]);
    }

    function onWorkletMessage(e) {
      const m = e.data;
      if (!m) return;
      if (m.type === "stats") {
        if (m.curMs !== currentBufferMs) {
          currentBufferMs = m.curMs;
          if (state === "connected") statusText.textContent = connectedText();
        }
        return;
      }
      if (m.type === "mic") {
        if (!micEnabled || !ws || ws.readyState !== WebSocket.OPEN) return;
        if (ws.bufferedAmount > 32768) return;
        ws.send(m.buf);
      }
    }

    if (IN_APP) {
      const triggerAuto = () => {
        if (state === "idle" && !scanning && !manualDisconnect && document.activeElement !== ipInput) {
          autoDiscoverServer(true);
        }
      };
      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", triggerAuto);
      } else {
        triggerAuto();
      }
      setInterval(triggerAuto, AUTO_RETRY_MS);
    }
  </script>
</body>
</html>
