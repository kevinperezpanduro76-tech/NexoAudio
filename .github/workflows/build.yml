name: Build NexoAudio (Windows EXE + Android APK)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Server (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and build EXE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --console --name NexoAudio --add-data "index.html;." --collect-all pyaudiowpatch server.py

      - name: Upload NexoAudio.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoAudio-Windows-EXE
          path: dist/NexoAudio.exe

  build-android:
    name: Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies & prepare web assets
        run: |
          npm install
          npm run copy:web
          npx cap add android
          if [ -d "android-overlay" ]; then
            cp -r android-overlay/* android/
          fi
          npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NexoAudio.apk

      - name: Upload NexoAudio.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoAudio-Android-APK
          path: NexoAudio.apk
